[project]
name = "rloops-llm-research"
version = "0.1.0"
description = "Research code for genomic language models and R-loop regions in hg38"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "einops==0.8.2",
    "huggingface-hub==0.36.2",
    "marimo[recommended]>=0.25.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyreadr>=0.5.7",
    "torch==2.15.0",
    "transformers==4.57.6",
]

[project.scripts]
rloops-llm-research = "rloops_llm_research:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
